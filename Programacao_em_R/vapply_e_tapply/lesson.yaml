- Class: meta
  Course: Programação em R
  Lesson: vapply e tapply
  Author: Nick Carchedi, Diogo B. Provete (Tradução)
  Type: Standard
  Organization: JHU Biostat
  Version: 2.2.11

- Class: text
  Output: "Na última lição, você aprendeu sobre os dois membros mais fundamentais da família de funções *apply do R - lapply() e sapply(). As duas recebem uma lista, aplicam uma função a cada elemento dela e depois combinam e devolvem o resultado. lapply() sempre devolve uma lista, enquanto sapply() tenta simplificar o resultado."

- Class: text
  Output: Nesta lição, você vai aprender a usar vapply() e tapply(), cada uma com um papel bem específico dentro da estratégia Dividir-Aplicar-Combinar. Para manter a coerência, vamos usar os mesmos dados da lição 'lapply e sapply'.

- Class: text
  Output: "Os dados Flags, do UCI Machine Learning Repository, trazem informações sobre vários países e suas bandeiras. Mais informações em https://archive.ics.uci.edu/dataset/40/flags"

- Class: text
  Output: Guardei os dados numa variável chamada flags. Se já faz um tempo que você terminou a lição 'lapply e sapply', talvez queira relembrar os dados usando funções como dim(), head(), str() e summary() quando voltar ao prompt (>). Você também pode digitar viewinfo() no prompt para abrir a documentação dos dados. Vamos começar!

- Class: cmd_question
  Output: Como você viu na última lição, a função unique() devolve um vetor com os valores únicos do objeto que recebe. Assim, sapply(flags, unique) devolve uma lista com um vetor de valores únicos para cada coluna dos dados flags. Experimente de novo agora.
  CorrectAnswer: sapply(flags, unique)
  AnswerTests: omnitest(correctExpr='sapply(flags, unique)')
  Hint: Use sapply(flags, unique) para obter uma lista com um vetor de valores únicos para cada coluna dos dados flags.

- Class: text
  Output: E se você tivesse esquecido como unique() funciona e achasse, por engano, que ela devolve o *número* de valores únicos do objeto que recebe? Nesse caso, você poderia esperar, erradamente, que sapply(flags, unique) devolvesse um vetor numérico, já que cada elemento da lista teria um único número e sapply() poderia então simplificar o resultado para um vetor.

- Class: text
  Output: Quando você trabalha de forma interativa (no prompt), isso não é um grande problema, porque você vê o resultado na hora e logo percebe o erro. Mas, quando trabalha de forma não interativa (por exemplo, escrevendo suas próprias funções), um mal-entendido pode passar despercebido e causar resultados errados mais adiante. Por isso, vale ser mais cuidadoso, e é aí que vapply() ajuda.

- Class: text
  Output: Enquanto sapply() tenta 'adivinhar' o formato certo do resultado, vapply() permite que você o especifique explicitamente. Se o resultado não bater com o formato especificado, vapply() gera um erro e interrompe a operação. Isso pode evitar problemas sérios no seu código, causados por valores inesperados vindos de sapply().

- Class: cmd_question
  Output: Experimente vapply(flags, unique, numeric(1)), que diz que você espera que cada elemento do resultado seja um vetor numérico de tamanho 1. Como NÃO é o caso, VOCÊ VAI RECEBER UM ERRO. Depois de ver o erro, digite ok() para passar para a próxima questão.
  CorrectAnswer: ok()
  AnswerTests: omnitest(correctExpr="ok()")
  Hint: Digite vapply(flags, unique, numeric(1)) e depois ok() para passar para a próxima questão.

- Class: cmd_question
  Output: Lembre, da lição anterior, que sapply(flags, class) devolve um vetor de texto com a classe de cada coluna dos dados. Experimente de novo agora para ver o resultado.
  CorrectAnswer: sapply(flags, class)
  AnswerTests: omnitest(correctExpr="sapply(flags, class)")
  Hint: Digite sapply(flags, class) para obter um vetor de texto com as classes das colunas.

- Class: cmd_question
  Output: Se quisermos deixar explícito o formato que esperamos do resultado, podemos usar vapply(flags, class, character(1)). O argumento 'character(1)' diz ao R que esperamos que a função class devolva um vetor de texto de tamanho 1 quando aplicada a CADA coluna dos dados flags. Experimente agora.
  CorrectAnswer: vapply(flags, class, character(1))
  AnswerTests: omnitest(correctExpr="vapply(flags, class, character(1))")
  Hint: Use vapply(flags, class, character(1)) para obter um vetor de texto com as classes das colunas.

- Class: text
  Output: Repare que, como nossa expectativa estava certa (isto é, character(1)), o resultado de vapply() é idêntico ao de sapply() - um vetor de texto com as classes das colunas.

- Class: text
  Output: Você pode pensar em vapply() como uma versão 'mais segura' de sapply(), já que ela exige que você especifique antes o formato da saída, em vez de deixar o R 'adivinhar' o que você queria. Além disso, vapply() às vezes é mais rápida que sapply() com dados grandes. Mas, na análise de dados interativa (no prompt), sapply() economiza digitação e muitas vezes basta.

- Class: text
  Output: Como analista de dados, você muitas vezes vai querer dividir os dados em grupos conforme o valor de alguma variável e depois aplicar uma função aos membros de cada grupo. A próxima função que vamos ver, tapply(), faz exatamente isso.

- Class: cmd_question
  Output: Use ?tapply para abrir a documentação.
  CorrectAnswer: ?tapply
  AnswerTests: any_of_exprs('?tapply', 'help(tapply)')
  Hint: Abra o arquivo de ajuda com ?tapply.

- Class: cmd_question
  Output: A variável 'landmass' dos nossos dados assume valores inteiros de 1 a 6, cada um representando uma região do mundo (1 = América do Norte, 2 = América do Sul, 3 = Europa, 4 = África, 5 = Ásia, 6 = Oceania). Use table(flags$landmass) para ver quantas bandeiras/países há em cada grupo.
  CorrectAnswer: table(flags$landmass)
  AnswerTests: omnitest(correctExpr="table(flags$landmass)")
  Hint: Use table(flags$landmass) para ver quantas bandeiras/países há em cada grupo.

- Class: cmd_question
  Output: A variável 'animate' dos nossos dados vale 1 se a bandeira do país tem uma imagem de ser vivo (por exemplo, uma águia, uma árvore, uma mão humana) e 0 se não tem. Use table(flags$animate) para ver quantas bandeiras têm uma imagem de ser vivo.
  CorrectAnswer: table(flags$animate)
  AnswerTests: omnitest(correctExpr="table(flags$animate)")
  Hint: Use table(flags$animate) para ver quantas bandeiras têm uma imagem de ser vivo.

- Class: text
  Output: Isso nos diz que 39 bandeiras têm uma imagem de ser vivo (animate = 1) e 155 não têm (animate = 0).

- Class: cmd_question
  Output: A média aritmética de um monte de 0s e 1s dá a proporção de 1s. Use tapply(flags$animate, flags$landmass, mean) para aplicar a função mean à variável 'animate' separadamente em cada um dos seis grupos de landmass. Isso nos dá a proporção de bandeiras com imagem de ser vivo DENTRO de cada região.
  CorrectAnswer: tapply(flags$animate, flags$landmass, mean)
  AnswerTests: omnitest(correctExpr="tapply(flags$animate, flags$landmass, mean)")
  Hint: tapply(flags$animate, flags$landmass, mean) mostra a proporção de bandeiras com imagem de ser vivo em cada região.

- Class: text
  Output: O primeiro grupo (landmass = 1) corresponde à América do Norte e tem a maior proporção de bandeiras com imagem de ser vivo (0.4194).

- Class: cmd_question
  Output: Do mesmo jeito, podemos ver um resumo dos valores de população (em milhões, arredondados) dos países com e sem a cor vermelha na bandeira, com tapply(flags$population, flags$red, summary).
  CorrectAnswer: tapply(flags$population, flags$red, summary)
  AnswerTests: omnitest(correctExpr="tapply(flags$population, flags$red, summary)")
  Hint: Você pode ver um resumo da população dos países com e sem a cor vermelha na bandeira com tapply(flags$population, flags$red, summary).

- Class: mult_question
  Output: Qual é a mediana da população (em milhões) dos países *sem* a cor vermelha na bandeira?
  AnswerChoices: 9.0; 4.0; 27.6; 3.0; 22.1; 0.0
  CorrectAnswer: 3.0
  AnswerTests: omnitest(correctVal='3.0')
  Hint: Use o resultado da última questão. Lembre que red = 0 significa que a cor vermelha NÃO está presente na bandeira do país.

- Class: cmd_question
  Output: Por fim, use a mesma abordagem para ver um resumo dos valores de população em cada uma das seis regiões (landmass).
  CorrectAnswer: tapply(flags$population, flags$landmass, summary)
  AnswerTests: omnitest(correctExpr="tapply(flags$population, flags$landmass, summary)")
  Hint: "Você pode ver um resumo da população em cada uma das seis regiões chamando tapply() com três argumentos - flags$population, flags$landmass e summary."

- Class: mult_question
  Output: Qual é a população máxima (em milhões) do quarto grupo (África)?
  AnswerChoices: 56.00; 1010.0; 119.0; 5.00; 157.00
  CorrectAnswer: 56.00
  AnswerTests: omnitest(correctVal='56.00')
  Hint: Use o resultado da última questão.

- Class: text
  Output: Nesta lição, você aprendeu a usar vapply() como alternativa mais segura a sapply(), o que ajuda sobretudo quando você escreve suas próprias funções. Também aprendeu a usar tapply() para dividir os dados em grupos conforme o valor de alguma variável e aplicar uma função a cada grupo. Essas funções vão ser muito úteis na sua jornada para se tornar um analista de dados melhor.

- Class: text
  Output: Uma dica para depois - no tidyverse, o pacote purrr tem funções equivalentes às que vimos. map() funciona como lapply() e sempre devolve uma lista. map_chr(), map_dbl(), map_int() e map_lgl() funcionam como vapply(), com o tipo da saída fixado no nome da função. Por exemplo, purrr::map_chr(flags, class) dá o mesmo resultado de vapply(flags, class, character(1)).

