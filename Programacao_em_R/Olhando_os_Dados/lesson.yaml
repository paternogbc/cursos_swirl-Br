- Class: meta
  Course: Programação em R
  Lesson: Olhando os Dados
  Author: Nick Carchedi, Diogo B. Provete (Tradução)
  Type: Standard
  Organization: JHU Biostat
  Version: 2.2.11

- Class: text
  Output: Sempre que você for trabalhar com um conjunto de dados novo, a primeira coisa a fazer é olhar para ele! Qual é o formato dos dados? Quais são as dimensões? Quais são os nomes das variáveis? Como as variáveis estão armazenadas? Há dados faltantes? Há algum problema nos dados?

- Class: text
  Output: Esta lição vai te ensinar a responder essas e outras perguntas usando funções que já vêm com o R. Vamos usar um conjunto de dados montado a partir da base PLANTS, do Departamento de Agricultura dos Estados Unidos (USDA), disponível em https://plants.usda.gov.

- Class: cmd_question
  Output: Guardei os dados para você numa variável chamada plants. Digite ls() para listar as variáveis do seu ambiente de trabalho; plants deve estar entre elas.
  CorrectAnswer: ls()
  AnswerTests: omnitest(correctExpr='ls()')
  Hint: Use ls() para listar as variáveis do seu ambiente de trabalho.

- Class: cmd_question
  Output: Vamos começar conferindo a classe da variável plants com class(plants). Isso dá uma pista sobre a estrutura geral dos dados.
  CorrectAnswer: class(plants)
  AnswerTests: omnitest(correctExpr='class(plants)')
  Hint: Use class(plants) para conferir a classe da variável plants.

- Class: text
  Output: É muito comum os dados estarem guardados num data frame. Essa é a classe padrão dos dados lidos no R com funções como read.csv() e read.table(), que você vai conhecer em outra lição.

- Class: cmd_question
  Output: Como os dados estão num data frame, sabemos que são retangulares. Ou seja, têm duas dimensões (linhas e colunas) e cabem direitinho numa tabela ou planilha. Use dim(plants) para ver exatamente com quantas linhas e colunas estamos lidando.
  CorrectAnswer: dim(plants)
  AnswerTests: omnitest(correctExpr='dim(plants)')
  Hint: Use dim(plants) para ver as dimensões exatas dos dados plants.

- Class: text
  Output: O primeiro número que você vê (5166) é o número de linhas (observações), e o segundo (10) é o número de colunas (variáveis).

- Class: cmd_question
  Output: Você também pode usar nrow(plants) para ver só o número de linhas. Experimente.
  CorrectAnswer: nrow(plants)
  AnswerTests: omnitest(correctExpr='nrow(plants)')
  Hint: Use nrow(plants) para ver só o número de linhas.

- Class: cmd_question
  Output: ... E ncol(plants) para ver só o número de colunas.
  CorrectAnswer: ncol(plants)
  AnswerTests: omnitest(correctExpr='ncol(plants)')
  Hint: Use ncol(plants) para ver só o número de colunas.

- Class: cmd_question
  Output: Se você tiver curiosidade de saber quanto espaço os dados ocupam na memória, pode usar object.size(plants).
  CorrectAnswer: object.size(plants)
  AnswerTests: omnitest(correctExpr='object.size(plants)')
  Hint: object.size(plants) mostra quanta memória o data frame plants ocupa.

- Class: cmd_question
  Output: Agora que temos uma ideia da forma e do tamanho dos dados, vamos ver o que tem dentro. names(plants) devolve um vetor de texto com os nomes das colunas (isto é, das variáveis). Experimente.
  CorrectAnswer: names(plants)
  AnswerTests: omnitest(correctExpr='names(plants)')
  Hint: names(plants) devolve um vetor de texto com os nomes das colunas (isto é, das variáveis).

- Class: text
  Output: Demos nomes bem descritivos às variáveis deste conjunto de dados, mas nem sempre vai ser assim. Um próximo passo lógico é dar uma espiada nos dados em si. Só que nossos dados têm mais de 5000 observações (linhas), então não dá para ver tudo de uma vez.

- Class: cmd_question
  Output: A função head() permite ver o começo dos dados. Experimente com um único argumento.
  CorrectAnswer: head(plants)
  AnswerTests: omnitest(correctExpr='head(plants)')
  Hint: head(plants) mostra o começo dos dados.

- Class: text
  Output: Tire um minuto para olhar e entender a saída acima. Cada linha é identificada pelo número da observação, e cada coluna pelo nome da variável. Sua tela provavelmente não é larga o bastante para mostrar as 10 colunas lado a lado; nesse caso, o R mostra quantas colunas couberem em cada linha e continua na linha seguinte.

- Class: cmd_question
  Output: Por padrão, head() mostra as seis primeiras linhas dos dados. Você pode mudar isso passando como segundo argumento o número de linhas que quer ver. Use head() para ver as 10 primeiras linhas de plants.
  CorrectAnswer: head(plants, 10)
  AnswerTests: omnitest(correctExpr='head(plants, 10)')
  Hint: head(plants, 10) mostra as 10 primeiras linhas dos dados.

- Class: cmd_question
  Output: O mesmo vale para tail(), que mostra o fim dos dados. Use tail() para ver as 15 últimas linhas.
  CorrectAnswer: tail(plants, 15)
  AnswerTests: omnitest(correctExpr='tail(plants, 15)')
  Hint: tail(plants, 15) mostra as 15 últimas linhas dos dados.

- Class: cmd_question
  Output: Depois de ver o começo e o fim dos dados, você deve ter notado vários NA, que é como o R marca valores faltantes. Use summary(plants) para ter uma ideia melhor de como cada variável está distribuída e de quanto falta nos dados.
  CorrectAnswer: summary(plants)
  AnswerTests: omnitest(correctExpr='summary(plants)')
  Hint: Experimente summary(plants) para ver como cada variável está distribuída e quantos valores faltantes existem.

- Class: text
  Output: summary() mostra uma saída diferente para cada variável, conforme a classe dela. Para dados numéricos, como Precip_Min, summary() mostra o mínimo, o 1º quartil, a mediana, a média, o 3º quartil e o máximo, além do número de NA. Esses valores ajudam a entender como os dados estão distribuídos.

- Class: text
  Output: Já as variáveis de texto, como Scientific_Name e Duration, aparecem só com Length, Class e Mode - ou seja, summary() diz apenas que são 5166 valores da classe character. (Em versões do R anteriores à 4.0.0, read.csv() transformava texto em factor, e summary() mostrava a contagem de cada categoria. Desde a 4.0.0, o padrão é stringsAsFactors = FALSE.) Para contar quantas vezes cada valor aparece numa variável categórica, usamos table().

- Class: cmd_question
  Output: Use table(plants$Duration) para ver quantas plantas há em cada categoria de duração do ciclo de vida.
  CorrectAnswer: table(plants$Duration)
  AnswerTests: omnitest(correctExpr='table(plants$Duration)')
  Hint: table(plants$Duration) mostra a contagem de cada valor da variável Duration.

- Class: text
  Output: A tabela mostra, por exemplo, que os dados têm 3031 plantas perenes (Perennial) e 682 anuais (Annual). Repare que table() ignora os NA por padrão; para contá-los também, use table(plants$Duration, useNA = "ifany").

- Class: cmd_question
  Output: Agora veja quantas vezes cada valor de Active_Growth_Period, o período de crescimento ativo, aparece nos dados, com table(plants$Active_Growth_Period).
  CorrectAnswer: table(plants$Active_Growth_Period)
  AnswerTests: omnitest(correctExpr='table(plants$Active_Growth_Period)')
  Hint: table(plants$Active_Growth_Period) mostra a contagem de cada valor da variável.

- Class: text
  Output: Cada uma das funções que vimos até agora tem seu papel para ajudar você a entender melhor a estrutura dos seus dados. Mas deixamos a melhor para o final...

- Class: cmd_question
  Output: Talvez a função mais útil e concisa para entender a estrutura (em inglês, *str*ucture) dos seus dados seja str(). Experimente agora.
  CorrectAnswer: str(plants)
  AnswerTests: omnitest(correctExpr='str(plants)')
  Hint: Use str(plants) para ver a estrutura dos seus dados.

- Class: text
  Output: A graça de str() é que ela junta vários recursos das outras funções que você já viu, num formato conciso e fácil de ler. Logo no começo, ela diz que a classe de plants é 'data.frame' e que há 5166 observações e 10 variáveis. Depois, mostra o nome e a classe de cada variável (chr para texto, num para números com casas decimais, int para inteiros), além de uma prévia do conteúdo.

- Class: text
  Output: Na verdade, str() é uma função bem geral, que funciona com a maioria dos objetos do R. Sempre que quiser entender a estrutura de alguma coisa (um conjunto de dados, uma função etc.), str() é um bom ponto de partida.

- Class: text
  Output: Nesta lição, você aprendeu a ter uma ideia da estrutura e do conteúdo de um conjunto de dados novo usando um punhado de funções simples e úteis. Dedicar um tempo a isso logo no início pode poupar tempo e frustração mais adiante na sua análise.

- Class: mult_question
  Output: Você gostaria de informar alguém sobre o teu sucesso em completar esta lição?
  CorrectAnswer: NULL
  AnswerChoices: Sim; Não
  AnswerTests: notify()
  Hint: NULL
