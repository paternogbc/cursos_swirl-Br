- Class: meta
  Course: Programação em R
  Lesson: lapply e sapply
  Author: Nick Carchedi, Diogo B. Provete (Tradução)
  Type: Standard
  Organization: JHU Biostat
  Version: 2.2.11

- Class: text
  Output: Nesta lição, você vai aprender a usar lapply() e sapply(), os dois membros mais importantes da família de funções *apply do R, também conhecidas como funções de laço (loop functions).

- Class: text
  Output: Essas funções poderosas, junto com suas parentes próximas (vapply() e tapply(), entre outras), oferecem um jeito conciso e prático de aplicar a estratégia Dividir-Aplicar-Combinar (Split-Apply-Combine) na análise de dados.

- Class: text
  Output: Cada uma das funções *apply vai DIVIDIR os dados em pedaços menores, APLICAR uma função a cada pedaço e depois COMBINAR os resultados. Uma discussão mais detalhada dessa estratégia está no artigo de Hadley Wickham no Journal of Statistical Software, 'The Split-Apply-Combine Strategy for Data Analysis'.

- Class: text
  Output: "Ao longo desta lição, vamos usar os dados Flags, do UCI Machine Learning Repository. Eles trazem informações sobre vários países e suas bandeiras, tiradas principalmente de um guia de bandeiras de 1986. Mais informações em https://archive.ics.uci.edu/dataset/40/flags"

- Class: text
  Output: Vamos direto ao ponto, para você ter uma ideia de como essas funções especiais funcionam!

- Class: cmd_question
  Output: Guardei os dados numa variável chamada flags. Digite head(flags) para ver as seis primeiras linhas (isto é, o 'head', a cabeça) dos dados.
  CorrectAnswer: head(flags)
  AnswerTests: omnitest(correctExpr='head(flags)')
  Hint: Digite head(flags) para ver o começo dos dados.

- Class: cmd_question
  Output: Talvez você precise rolar a tela para cima para ver toda a saída. Agora, vamos conferir as dimensões dos dados com dim(flags).
  CorrectAnswer: dim(flags)
  AnswerTests: omnitest(correctExpr='dim(flags)')
  Hint: Digite dim(flags) para ver as dimensões dos dados.

- Class: text
  Output: Isso nos diz que há 194 linhas, ou observações, e 30 colunas, ou variáveis. Cada observação é um país, e cada variável descreve alguma característica do país ou da sua bandeira. Para abrir uma descrição mais completa dos dados num arquivo de texto separado, digite viewinfo() quando voltar ao prompt (>).

- Class: cmd_question
  Output: Como em qualquer conjunto de dados, queremos saber em que formato as variáveis estão guardadas. Ou seja, qual é a 'classe' de cada variável? O que acontece se usarmos class(flags)? Experimente.
  CorrectAnswer: class(flags)
  AnswerTests: omnitest(correctExpr='class(flags)')
  Hint: Digite class(flags) para ver o que acontece.

- Class: text
  Output: Isso só nos diz que os dados inteiros estão guardados como 'data.frame', o que não responde à nossa pergunta. O que precisamos mesmo é chamar a função class() para cada coluna. Até daria para fazer isso manualmente (uma coluna de cada vez), mas é bem mais rápido automatizar o processo. Parece coisa para um laço!

- Class: text
  Output: A função lapply() recebe uma lista, aplica uma função a cada elemento dela e devolve uma lista do mesmo tamanho que a original. Como um data frame é, no fundo, só uma lista de vetores (você pode ver isso com as.list(flags)), podemos usar lapply() para aplicar a função class() a cada coluna dos dados flags. Vamos ver na prática!

- Class: cmd_question
  Output: Digite cls_list <- lapply(flags, class) para aplicar a função class() a cada coluna dos dados flags e guardar o resultado numa variável chamada cls_list. Repare que você só informa o nome da função que quer aplicar (isto é, class), sem os parênteses de costume depois dele.
  CorrectAnswer: cls_list <- lapply(flags, class)
  AnswerTests: omnitest(correctExpr='cls_list <- lapply(flags, class)')
  Hint: Digite cls_list <- lapply(flags, class) para aplicar a função class() a cada coluna dos dados e guardar o resultado numa variável chamada cls_list.

- Class: cmd_question
  Output: Digite cls_list para ver o resultado.
  CorrectAnswer: cls_list
  AnswerTests: omnitest(correctExpr='cls_list')
  Hint: Digite cls_list para ver o resultado.

- Class: cmd_question
  Output: O 'l' de 'lapply' vem de 'list' (lista). Digite class(cls_list) para confirmar que lapply() devolveu uma lista.
  CorrectAnswer: class(cls_list)
  AnswerTests: omnitest(correctExpr='class(cls_list)')
  Hint: Digite class(cls_list) para confirmar que lapply() devolveu uma lista.

- Class: text
  Output: Como esperado, obtivemos uma lista de tamanho 30 - um elemento para cada variável/coluna. A saída ficaria bem mais compacta se pudéssemos representá-la como um vetor, e não como uma lista.

- Class: cmd_question
  Output: Talvez você lembre, de uma lição anterior, que listas são mais úteis para guardar dados de várias classes. Neste caso, como cada elemento da lista devolvida por lapply() é um vetor de texto de tamanho um (por exemplo, "integer" ou "character"), cls_list pode ser simplificada para um vetor de texto. Para fazer isso manualmente, digite as.character(cls_list).
  CorrectAnswer: as.character(cls_list)
  AnswerTests: omnitest(correctExpr='as.character(cls_list)')
  Hint: Digite as.character(cls_list) para converter cls_list num vetor de texto.

- Class: cmd_question
  Output: sapply() automatiza esse processo - ela chama lapply() por trás dos panos e depois tenta simplificar o resultado para você (daí o 's' de 'sapply', de simplify). Use sapply() do mesmo jeito que usou lapply() para obter a classe de cada coluna dos dados flags e guarde o resultado em cls_vect. Se precisar de ajuda, digite ?sapply para abrir a documentação.
  CorrectAnswer: cls_vect <- sapply(flags, class)
  AnswerTests: omnitest(correctExpr='cls_vect <- sapply(flags, class)')
  Hint: Digite cls_vect <- sapply(flags, class) para guardar as classes das colunas num vetor de texto chamado cls_vect.

- Class: cmd_question
  Output: Use class(cls_vect) para confirmar que sapply() simplificou o resultado para um vetor de texto.
  CorrectAnswer: class(cls_vect)
  AnswerTests: omnitest(correctExpr='class(cls_vect)')
  Hint: Digite class(cls_vect) para confirmar que sapply() devolveu um vetor de texto.

- Class: text
  Output: Em geral, se o resultado é uma lista em que todo elemento tem tamanho um, sapply() devolve um vetor. Se o resultado é uma lista em que todo elemento é um vetor do mesmo tamanho (> 1), sapply() devolve uma matriz. Se sapply() não consegue decidir, simplesmente devolve uma lista, igualzinha à que lapply() daria.

- Class: text
  Output: Vamos praticar mais um pouco com lapply() e sapply()!

- Class: text
  Output: As colunas 11 a 17 dos nossos dados são variáveis indicadoras, cada uma representando uma cor. O valor da variável indicadora é 1 se a cor está presente na bandeira do país e 0 se não está.

- Class: cmd_question
  Output: Assim, se quisermos saber o número total de países (nos nossos dados) que têm, por exemplo, a cor laranja na bandeira, basta somar todos os 1s e 0s da coluna 'orange'. Experimente sum(flags$orange) para ver isso.
  CorrectAnswer: sum(flags$orange)
  AnswerTests: omnitest(correctExpr='sum(flags$orange)')
  Hint: Use sum(flags$orange) para somar todos os 1s e 0s da coluna 'orange'.

- Class: text
  Output: Agora queremos repetir essa operação para cada uma das cores registradas nos dados.

- Class: cmd_question
  Output: Primeiro, use flag_colors <- flags[, 11:17] para extrair as colunas com os dados de cores e guardá-las num novo data frame chamado flag_colors. (Repare na vírgula antes de 11:17. Esse comando de subconjunto diz ao R que queremos todas as linhas, mas só as colunas 11 a 17.)
  CorrectAnswer: flag_colors <- flags[, 11:17]
  AnswerTests: omnitest(correctExpr='flag_colors <- flags[, 11:17]')
  Hint: flag_colors <- flags[, 11:17] resolve!

- Class: cmd_question
  Output: Use a função head() para ver as 6 primeiras linhas de flag_colors.
  CorrectAnswer: head(flag_colors)
  AnswerTests: omnitest(correctExpr='head(flag_colors)')
  Hint: head(flag_colors) mostra as seis primeiras linhas de flag_colors.

- Class: cmd_question
  Output: Para obter uma lista com a soma de cada coluna de flag_colors, chame a função lapply() com dois argumentos. O primeiro é o objeto sobre o qual vamos fazer o laço (isto é, flag_colors), e o segundo é o nome da função que queremos aplicar a cada coluna (isto é, sum). Lembre que o segundo argumento é só o nome da função, sem parênteses.
  CorrectAnswer: lapply(flag_colors, sum)
  AnswerTests: omnitest(correctExpr='lapply(flag_colors, sum)')
  Hint: Use lapply(flag_colors, sum) para obter a soma de cada coluna.

- Class: text
  Output: Isso nos diz que, das 194 bandeiras nos nossos dados, 153 têm a cor vermelha (red), 91 têm verde (green), 99 têm azul (blue), e assim por diante.

- Class: cmd_question
  Output: O resultado é uma lista, já que lapply() sempre devolve uma lista. Cada elemento dessa lista tem tamanho um, então o resultado pode ser simplificado para um vetor usando sapply() em vez de lapply(). Experimente agora.
  CorrectAnswer: sapply(flag_colors, sum)
  AnswerTests: omnitest(correctExpr='sapply(flag_colors, sum)')
  Hint: Use sapply(flag_colors, sum) para obter um vetor com as somas das colunas.

- Class: text
  Output: Talvez seja mais informativo calcular a proporção de bandeiras (entre as 194) que têm cada cor. Como cada coluna é só um monte de 1s e 0s, a média aritmética de cada coluna dá a proporção de 1s. (Se não estiver claro por quê, pense num caso mais simples, com três 1s e dois 0s - (1 + 1 + 1 + 0 + 0)/5 = 3/5 = 0.6.)

- Class: cmd_question
  Output: Use sapply() para aplicar a função mean() a cada coluna de flag_colors. Lembre que o segundo argumento de sapply() deve ser só o nome da função (isto é, mean) que você quer aplicar.
  CorrectAnswer: sapply(flag_colors, mean)
  AnswerTests: omnitest(correctExpr='sapply(flag_colors, mean)')
  Hint: sapply(flag_colors, mean) resolve!

- Class: text
  Output: Nos exemplos que vimos até agora, sapply() conseguiu simplificar o resultado para um vetor. Isso porque cada elemento da lista devolvida por lapply() era um vetor de tamanho um. Lembre que sapply() devolve uma matriz quando cada elemento da lista devolvida por lapply() é um vetor do mesmo tamanho (> 1).

- Class: cmd_question
  Output: Para mostrar isso, vamos extrair as colunas 19 a 23 dos dados flags e guardar o resultado num novo data frame chamado flag_shapes. flag_shapes <- flags[, 19:23] faz isso.
  CorrectAnswer: flag_shapes <- flags[, 19:23]
  AnswerTests: omnitest(correctExpr='flag_shapes <- flags[, 19:23]')
  Hint: flag_shapes <- flags[, 19:23] guarda as colunas 19 a 23 numa nova variável.

- Class: text
  Output: Cada uma dessas colunas (isto é, variáveis) representa o número de vezes que uma certa forma ou desenho aparece na bandeira de um país - círculos, cruzes, cruzes diagonais, quartos e sóis ou estrelas. Queremos saber o número mínimo e o máximo de vezes que cada forma ou desenho aparece.

- Class: cmd_question
  Output: A função range() devolve o mínimo e o máximo do seu primeiro argumento, que deve ser um vetor numérico. Use lapply() para aplicar a função range a cada coluna de flag_shapes. Não precisa guardar o resultado numa nova variável. A esta altura, já sabemos que lapply() sempre devolve uma lista.
  CorrectAnswer: lapply(flag_shapes, range)
  AnswerTests: omnitest(correctExpr='lapply(flag_shapes, range)')
  Hint: Experimente lapply(flag_shapes, range) para aplicar a função range() a cada coluna de flag_shapes.

- Class: cmd_question
  Output: Faça a mesma operação, mas usando sapply(), e guarde o resultado numa variável chamada shape_mat.
  CorrectAnswer: shape_mat <- sapply(flag_shapes, range)
  AnswerTests: omnitest(correctExpr='shape_mat <- sapply(flag_shapes, range)')
  Hint: shape_mat <- sapply(flag_shapes, range) aplica a função range() a cada coluna de flag_shapes e guarda o resultado em shape_mat.

- Class: cmd_question
  Output: Veja o conteúdo de shape_mat.
  CorrectAnswer: shape_mat
  AnswerTests: any_of_exprs('shape_mat', 'print(shape_mat)')
  Hint: Digite shape_mat para ver o conteúdo.

- Class: text
  Output: Cada coluna de shape_mat mostra o número mínimo (linha 1) e o máximo (linha 2) de vezes que a forma correspondente aparece nas bandeiras.

- Class: cmd_question
  Output: Use a função class() para confirmar que shape_mat é uma matriz.
  CorrectAnswer: class(shape_mat)
  AnswerTests: omnitest(correctExpr='class(shape_mat)')
  Hint: class(shape_mat) devolve a classe de shape_mat.

- Class: text
  Output: (Desde o R 4.0.0, class() de uma matriz devolve "matrix" e "array", porque toda matriz é um array de duas dimensões.)

- Class: text
  Output: Como vimos, sapply() sempre tenta simplificar o resultado dado por lapply(). Ela conseguiu isso em todos os exemplos que vimos até agora. Vamos ver um exemplo em que sapply() não consegue descobrir como simplificar o resultado e, por isso, devolve uma lista, igual à de lapply().

- Class: cmd_question
  Output: Quando recebe um vetor, a função unique() devolve um vetor sem os elementos repetidos. Em outras palavras, unique() devolve um vetor só com os elementos 'únicos'. Para ver como funciona, experimente unique(c(3, 4, 5, 5, 5, 6, 6)).
  CorrectAnswer: unique(c(3, 4, 5, 5, 5, 6, 6))
  AnswerTests: omnitest(correctExpr='unique(c(3, 4, 5, 5, 5, 6, 6))')
  Hint: Use unique(c(3, 4, 5, 5, 5, 6, 6)) para ver como a função unique() funciona.

- Class: cmd_question
  Output: Queremos saber os valores únicos de cada variável dos dados flags. Para isso, use lapply() para aplicar a função unique() a cada coluna dos dados flags, guardando o resultado numa variável chamada unique_vals.
  CorrectAnswer: unique_vals <- lapply(flags, unique)
  AnswerTests: omnitest(correctExpr='unique_vals <- lapply(flags, unique)')
  Hint: Experimente unique_vals <- lapply(flags, unique).

- Class: cmd_question
  Output: Mostre o valor de unique_vals no console.
  CorrectAnswer: unique_vals
  AnswerTests: any_of_exprs('unique_vals', 'print(unique_vals)')
  Hint: Digite unique_vals para ver o conteúdo.

- Class: cmd_question
  Output: "Como unique_vals é uma lista, você pode usar o que aprendeu para descobrir o tamanho de cada elemento de unique_vals (isto é, o número de valores únicos de cada variável). Simplifique o resultado, se possível. Dica: aplique a função length() a cada elemento de unique_vals."
  CorrectAnswer: sapply(unique_vals, length)
  AnswerTests: omnitest(correctExpr='sapply(unique_vals, length)')
  Hint: Aplique a função length() a cada elemento da lista unique_vals usando sapply(). Lembre, sem parênteses depois do nome da função que você está aplicando (isto é, length).

- Class: text
  Output: O fato de os elementos da lista unique_vals serem todos vetores de tamanhos *diferentes* é um problema para sapply(), já que não há um jeito óbvio de simplificar o resultado.

- Class: cmd_question
  Output: Use sapply() para aplicar a função unique() a cada coluna dos dados flags e veja que você obtém a mesma lista não simplificada que obteve com lapply().
  CorrectAnswer: sapply(flags, unique)
  AnswerTests: omnitest(correctExpr='sapply(flags, unique)')
  Hint: Use sapply(flags, unique) para aplicar a função unique a cada coluna de flags, sem conseguir simplificar o resultado.

- Class: text
  Output: De vez em quando, você pode precisar aplicar uma função que ainda não existe e, por isso, vai ter de escrever a sua própria. Escrever funções no R vai além do escopo desta lição, mas vamos ver um exemplo rápido de como fazer isso no contexto das funções de laço.

- Class: text
  Output: Suponha que você só está interessado no segundo item de cada elemento da lista unique_vals que acabou de criar. Como cada elemento de unique_vals é um vetor, e não conhecemos nenhuma função pronta do R que devolva o segundo elemento de um vetor, vamos construir a nossa própria função.

- Class: cmd_question
  Output: lapply(unique_vals, function(elem) elem[2]) devolve uma lista com o segundo item de cada elemento da lista unique_vals. Repare que nossa função recebe um argumento, elem, que é só uma 'variável muda' (dummy) que assume, um de cada vez, o valor de cada elemento de unique_vals.
  CorrectAnswer: lapply(unique_vals, function(elem) elem[2])
  AnswerTests: calculates_same_value('lapply(unique_vals, function(elem) elem[2])')
  Hint: Use lapply(unique_vals, function(elem) elem[2]) para obter uma lista com o segundo item de cada elemento da lista unique_vals.

- Class: text
  Output: A única diferença entre os exemplos anteriores e este é que estamos definindo e usando nossa própria função dentro da chamada a lapply(). Nossa função não tem nome e desaparece assim que lapply() termina de usá-la. Essas chamadas 'funções anônimas' podem ser muito úteis quando nenhuma função pronta do R serve.

- Class: text
  Output: Nesta lição, você aprendeu a usar as poderosas funções lapply() e sapply() para aplicar uma operação aos elementos de uma lista. Na próxima lição, vamos conhecer algumas parentes próximas de lapply() e sapply().

